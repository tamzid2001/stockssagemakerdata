name: SPY constituents rolling 500-close five-model backtest
run-name: SPY rolling daily backtest · ${{ inputs.resume_campaign || inputs.as_of || 'latest completed session' }}

on:
  workflow_dispatch:
    inputs:
      resume_campaign:
        description: Existing encrypted campaign ID; blank freezes a new Alpaca/universe snapshot
        type: string
        default: ''
      code_ref:
        description: main for a new study; exact original commit SHA for continuation
        type: string
        default: main
      as_of:
        description: Optional completed NYSE session YYYY-MM-DD; blank selects the latest completed session
        type: string
        default: ''
      shard_count:
        description: Parallel checkpoint shards (immutable after campaign creation)
        type: choice
        options: ['16', '8', '32']
        default: '16'
      max_symbols:
        description: Zero runs every official SPY equity holding plus SPY itself
        type: number
        default: 0
      max_new_origins:
        description: Zero uses the time budget; a positive value bounds new origins per shard for validation
        type: number
        default: 0
      continuous:
        description: Dispatch the next exact-code continuation until every shard completes
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: spy-daily-500-${{ inputs.resume_campaign || inputs.as_of || 'latest' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Freeze or restore campaign
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      campaign_id: ${{ steps.study.outputs.campaign_id }}
      matrix: ${{ steps.study.outputs.matrix }}
      code_sha: ${{ steps.revision.outputs.code_sha }}
    steps:
      - name: Validate immutable identifiers
        env:
          RESUME_CAMPAIGN: ${{ inputs.resume_campaign }}
          CODE_REF: ${{ inputs.code_ref }}
          AS_OF: ${{ inputs.as_of }}
          MAX_SYMBOLS: ${{ inputs.max_symbols }}
          MAX_ORIGINS: ${{ inputs.max_new_origins }}
        run: |
          [[ "$CODE_REF" == main || "$CODE_REF" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ -z "$RESUME_CAMPAIGN" || "$RESUME_CAMPAIGN" =~ ^p90-[a-f0-9]{24}$ ]] || exit 1
          [[ -z "$RESUME_CAMPAIGN" || "$CODE_REF" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ -z "$AS_OF" || "$AS_OF" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || exit 1
          [[ "$MAX_SYMBOLS" =~ ^[0-9]+$ && "$MAX_ORIGINS" =~ ^[0-9]+$ ]] || exit 1
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.code_ref }}
          persist-credentials: false
      - id: revision
        name: Record immutable analysis revision
        run: |
          code_sha=$(git rev-parse HEAD)
          echo "QUANTURA_CODE_SHA=$code_sha" >> "$GITHUB_ENV"
          echo "code_sha=$code_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-screener-marketdata.lock
            market_research/requirements.lock
      - name: Install preparation and test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.5.2 pandas==2.3.3 pandas-market-calendars==5.4.0
          requests==2.32.5 lxml==6.0.2 beautifulsoup4==4.14.3
          openpyxl==3.1.5
          httpx==0.28.1 cryptography==50.0.1 firebase-admin==7.5.0
          pyyaml==6.0.3 pytest==8.4.2
      - name: Verify rolling windows, signals, turnover and workflow handoff
        run: python -m pytest -q ensemble_forecasting/tests/test_spy_daily_backtest.py ensemble_forecasting/tests/test_kalshi_perp_backtest.py
      - id: study
        name: Freeze Alpaca closes and current constituent universe
        env:
          RESUME_CAMPAIGN: ${{ inputs.resume_campaign }}
          AS_OF: ${{ inputs.as_of }}
          SHARDS: ${{ inputs.shard_count }}
          MAX_SYMBOLS: ${{ inputs.max_symbols }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_DATA_URL: ${{ vars.ALPACA_DATA_URL || 'https://data.alpaca.markets' }}
          ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED || 'iex' }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          QUANTURA_RESEARCH_ARTIFACT_KEY: ${{ secrets.QUANTURA_RESEARCH_ARTIFACT_KEY }}
        run: |
          if [[ -n "$RESUME_CAMPAIGN" ]]; then
            python -m ensemble_forecasting.spy_daily_backtest resume --campaign "$RESUME_CAMPAIGN"
          else
            args=(prepare --shards "$SHARDS")
            [[ -z "$AS_OF" ]] || args+=(--as-of "$AS_OF")
            [[ "$MAX_SYMBOLS" == 0 ]] || args+=(--max-symbols "$MAX_SYMBOLS")
            python -m ensemble_forecasting.spy_daily_backtest "${args[@]}"
          fi

  worker:
    name: Rolling origin shard ${{ matrix.shard }}
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.code_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: market_research/requirements.lock
      - name: Install locked CPU five-model environment
        run: python -m pip install --no-cache-dir --require-hashes -r market_research/requirements.lock
      - name: Verify model access and immutable revision
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.code_sha }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TIMESFM_COMMERCIAL_LICENSED: ${{ vars.TIMESFM_COMMERCIAL_LICENSED || 'false' }}
          TIMESFM_HF_ACCESS_APPROVED: ${{ vars.TIMESFM_HF_ACCESS_APPROVED || 'false' }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -n "$HF_TOKEN"
          test "$TIMESFM_COMMERCIAL_LICENSED" = true
          test "$TIMESFM_HF_ACCESS_APPROVED" = true
      - id: origins
        name: Run checkpointed real five-model origins
        env:
          QUANTURA_CODE_SHA: ${{ needs.prepare.outputs.code_sha }}
          CAMPAIGN_ID: ${{ needs.prepare.outputs.campaign_id }}
          SHARD: ${{ matrix.shard }}
          MAX_NEW_ORIGINS: ${{ inputs.max_new_origins }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          QUANTURA_RESEARCH_ARTIFACT_KEY: ${{ secrets.QUANTURA_RESEARCH_ARTIFACT_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HOME: ${{ runner.temp }}/quantura-hf
          TIMESFM_COMMERCIAL_LICENSED: ${{ vars.TIMESFM_COMMERCIAL_LICENSED || 'false' }}
          TIMESFM_HF_ACCESS_APPROVED: ${{ vars.TIMESFM_HF_ACCESS_APPROVED || 'false' }}
        run: |
          args=(run-shard --campaign "$CAMPAIGN_ID" --shard "$SHARD" --budget-minutes 270)
          [[ "$MAX_NEW_ORIGINS" == 0 ]] || args+=(--max-new-origins "$MAX_NEW_ORIGINS")
          python -m ensemble_forecasting.spy_daily_backtest "${args[@]}"

  aggregate:
    name: Progress or final portfolio report
    needs: [prepare, worker]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.code_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install reporting dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          numpy==2.5.2 pandas==2.3.3 pandas-market-calendars==5.4.0
          requests==2.32.5 httpx==0.28.1 cryptography==50.0.1
          firebase-admin==7.5.0
      - id: report
        name: Build checkpoint progress or final report
        env:
          QUANTURA_CODE_SHA: ${{ needs.prepare.outputs.code_sha }}
          CAMPAIGN_ID: ${{ needs.prepare.outputs.campaign_id }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          QUANTURA_RESEARCH_ARTIFACT_KEY: ${{ secrets.QUANTURA_RESEARCH_ARTIFACT_KEY }}
        run: python -m ensemble_forecasting.spy_daily_backtest aggregate --campaign "$CAMPAIGN_ID" --output artifacts/spy-daily-backtest
      - name: Publish current summary
        run: cat artifacts/spy-daily-backtest/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Store final result tables in this Actions run
        if: steps.report.outputs.complete == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: spy-daily-500-backtest-${{ needs.prepare.outputs.campaign_id }}
          path: artifacts/spy-daily-backtest/
          if-no-files-found: error
          retention-days: 90
      - name: Store short-lived progress pointer
        if: steps.report.outputs.complete != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: spy-daily-500-progress-${{ needs.prepare.outputs.campaign_id }}-${{ github.run_id }}
          path: artifacts/spy-daily-backtest/
          if-no-files-found: error
          retention-days: 3
      - name: Continue unfinished campaign
        if: ${{ needs.worker.result == 'success' && inputs.continuous && steps.report.outputs.complete == 'false' }}
        uses: actions/github-script@v8
        env:
          CAMPAIGN_ID: ${{ needs.prepare.outputs.campaign_id }}
          QUANTURA_CODE_SHA: ${{ needs.prepare.outputs.code_sha }}
          SHARDS: ${{ inputs.shard_count }}
          MAX_SYMBOLS: ${{ inputs.max_symbols }}
          MAX_NEW_ORIGINS: ${{ inputs.max_new_origins }}
        with:
          script: |
            if (!/^p90-[a-f0-9]{24}$/.test(process.env.CAMPAIGN_ID) || !/^[a-f0-9]{40}$/.test(process.env.QUANTURA_CODE_SHA)) {
              throw new Error('VERIFIED_SPY_DAILY_CHECKPOINT_REQUIRED');
            }
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'spy-daily-500-backtest.yml',
              ref: 'main',
              inputs: {
                resume_campaign:process.env.CAMPAIGN_ID,
                code_ref:process.env.QUANTURA_CODE_SHA,
                as_of: '',
                shard_count: process.env.SHARDS,
                max_symbols: process.env.MAX_SYMBOLS,
                max_new_origins: process.env.MAX_NEW_ORIGINS,
                continuous: 'true'
              }
            });
      - name: Stop disclosure
        if: ${{ needs.worker.result != 'success' }}
        run: echo 'At least one shard failed, so no automatic successor was dispatched. Every completed origin remains encrypted and checkpointed; rerun this campaign on its recorded code SHA after diagnosing the failed shard.' >> "$GITHUB_STEP_SUMMARY"
