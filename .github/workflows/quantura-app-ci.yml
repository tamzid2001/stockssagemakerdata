name: Quantura App CI

on:
  pull_request:
    paths:
      - ".env.example"
      - "forecast_intelligence/**"
      - "config/**"
      - "requirements-forecast-intelligence.txt"
      - "requirements-forecast-intelligence-service.txt"
      - ".gitignore"
      - "quantura_site/**"
      - "README.md"
      - "SECURITY.md"
      - "TROUBLESHOOTING.md"
      - "docs/release-checklist.md"
      - "scripts/setup_local_firebase_credentials.sh"
      - ".github/workflows/quantura-app-ci.yml"
      - ".github/workflows/forecast-intelligence.yml"
  push:
    branches:
      - main
    paths:
      - ".env.example"
      - "forecast_intelligence/**"
      - "config/**"
      - "requirements-forecast-intelligence.txt"
      - "requirements-forecast-intelligence-service.txt"
      - ".gitignore"
      - "quantura_site/**"
      - "README.md"
      - "SECURITY.md"
      - "TROUBLESHOOTING.md"
      - "docs/release-checklist.md"
      - "scripts/setup_local_firebase_credentials.sh"
      - ".github/workflows/quantura-app-ci.yml"
      - ".github/workflows/forecast-intelligence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Quantura app and SSR templates
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest exchange-calendars

      - name: Install web and backend deps
        run: |
          npm ci --prefix quantura_site
          npm ci --prefix quantura_site/functions_explore

      - name: Run Quantura tests
        run: |
          pytest -q quantura_site/tests

      - name: Run Forecast Intelligence leakage and schema tests
        run: |
          pytest -q forecast_intelligence/tests

      - name: Build Quantura web bundle
        run: |
          npm run build --prefix quantura_site

      - name: Build Explore backend
        run: |
          npm run build --prefix quantura_site/functions_explore

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Run Forecast API Firestore integration tests
        working-directory: quantura_site
        run: |
          npx --yes firebase-tools@15.7.0 emulators:exec \
            --only firestore \
            --project quantura-forecast-integration \
            "node --test functions_explore/dist/quanturaForecastRoutes.integration.test.js"

      - name: Syntax check frontend and SSR entrypoints
        run: |
          node --check quantura_site/public/app.js
          node --check quantura_site/public/forecasts.js
          node --check quantura_site/public/forecast-admin.js
          node --check quantura_site/functions_ssr/index.js

      - name: Verify local-only secret files are not tracked
        run: |
          set -euo pipefail
          forbidden_files=(
            "quantura_site/functions/serviceAccountKey.json"
            "quantura_ios/quantura_ios/GoogleService-Info.plist"
            "quantura_android/app/google-services.json"
          )

          tracked="$(git ls-files)"
          violations=0

          for path in "${forbidden_files[@]}"; do
            if grep -Fxq "$path" <<<"$tracked"; then
              echo "Tracked local-only secret file detected: $path"
              violations=$((violations + 1))
            fi
          done

          if [[ "$violations" -gt 0 ]]; then
            exit 1
          fi

      - name: Verify SSR templates are synced
        run: |
          node quantura_site/functions_ssr/scripts/sync-templates.js
          git diff --exit-code -- quantura_site/functions_ssr/templates

      - name: Verify legal links and disclaimer route
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          repo = Path(".")
          pages = [
              repo / "quantura_site/pages/index.html",
              repo / "quantura_site/pages/forecasting.html",
              repo / "quantura_site/pages/screener.html",
              repo / "quantura_site/pages/dashboard.html",
              repo / "quantura_site/pages/pricing.html",
              repo / "quantura_site/pages/contact.html",
              repo / "quantura_site/pages/terms.html",
              repo / "quantura_site/pages/privacy.html",
              repo / "quantura_site/pages/disclaimer.html",
          ]
          required_links = ["/terms", "/privacy", "/disclaimer"]

          for page in pages:
              html = page.read_text(encoding="utf-8")
              for link in required_links:
                  assert f'href="{link}"' in html, f"{page} missing link: {link}"

          firebase_json = json.loads((repo / "quantura_site/firebase.json").read_text(encoding="utf-8"))
          rewrites = firebase_json.get("hosting", {}).get("rewrites", [])
          assert any(item.get("source") == "/disclaimer" for item in rewrites), "firebase.json missing /disclaimer rewrite"
          print("Legal link and route checks passed.")
          PY
