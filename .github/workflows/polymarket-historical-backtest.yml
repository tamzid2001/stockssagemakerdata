name: Polymarket US Historical Ensemble Backtest
on:
  workflow_dispatch:
    inputs:
      horizon:
        description: Rolling forecast horizon in minutes
        type: choice
        options: ['30', '60']
        default: '30'
      max_contracts:
        description: Maximum sides (even number 2–500; each moneyline has two)
        type: number
        default: 100
      max_origins:
        description: Maximum rolling origins per side (1–1000)
        type: number
        default: 100
      smoke_mode:
        description: Mock tests only or actual historical data/model inference
        type: choice
        options: [mock, real]
        default: mock
permissions:
  contents: read
concurrency:
  group: polymarket-historical-backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Record hard runner deadline
        run: |
          echo "QUANTURA_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "QUANTURA_CODE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: No-model safety suite
        if: inputs.smoke_mode == 'mock'
        run: |
          python -m pip install pytest==8.4.2 pyyaml==6.0.3
          python -m pytest -q market_research/tests/test_engine.py market_research/tests/test_workflows.py
      - name: Install locked CPU research environment
        if: inputs.smoke_mode == 'real'
        run: python -m pip install --no-cache-dir --require-hashes --requirement market_research/requirements.lock
      - name: Run and persist actual historical rolling ensemble backtest
        if: inputs.smoke_mode == 'real'
        env:
          PAPER_HORIZON: ${{ inputs.horizon }}
          MAX_CONTRACTS: ${{ inputs.max_contracts }}
          MAX_ORIGINS: ${{ inputs.max_origins }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HOME: ${{ runner.temp }}/quantura-hf
          TIMESFM_COMMERCIAL_LICENSED: 'false'
        run: python -m market_research.worker --mode historical --horizon "$PAPER_HORIZON" --max-contracts "$MAX_CONTRACTS" --max-origins "$MAX_ORIGINS" --duration-minutes 345
      - name: Failure disclosure
        if: failure()
        run: echo 'Historical research failed. Detailed data is not uploaded to public artifacts; no profitability claim is implied.' >> "$GITHUB_STEP_SUMMARY"
