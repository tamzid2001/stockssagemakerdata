name: Kalshi BTC Live Read-Only Diagnostic
run-name: Kalshi BTC read-only execution diagnostic · subaccount ${{ inputs.subaccount || 0 }}
on:
  workflow_dispatch:
    inputs:
      subaccount:
        type: number
        default: 0
        description: Existing Kalshi subaccount to inspect; 0 is the primary account.
permissions:
  contents: read
concurrency:
  group: quantura-kalshi-btc-read-only-diagnostic
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: quantura-kalshi-live
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r market_research/requirements.lock
      - name: Inspect live journal and exchange account without write authorization
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_PROD_API_KEY }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          DIAGNOSTIC_SUBACCOUNT: ${{ inputs.subaccount || 0 }}
        run: python -m market_research.kalshi_live_diagnostics --subaccount "$DIAGNOSTIC_SUBACCOUNT"
