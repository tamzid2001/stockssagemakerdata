name: Kalshi Private Historical Sports Replay Archive
on:
  workflow_dispatch:
    inputs:
      resume_artifact_id:
        description: Retained encrypted artifact ID to restore (0 starts fresh)
        type: number
        default: 0
      max_pages:
        description: Maximum settled event pages this run (1–1000)
        type: number
        default: 20
      series_ticker:
        description: Optional Sports series (blank scans game/match/moneyline series)
        type: string
        default: ''
      start_cursor:
        description: Exact JSON next cursor from previous coverage report, or 0
        type: string
        default: '0'
      catalog_id:
        description: Immutable catalog ID for resuming an incomplete page
        type: string
        default: ''
      market_offset:
        description: Market offset within the resumed catalog
        type: number
        default: 0
      smoke_mode:
        description: Safety tests or actual private downloads (no model inference or orders)
        type: choice
        options: [mock, real]
        default: mock
permissions:
  contents: read
  actions: read
concurrency:
  group: kalshi-replay-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Record deadline
        run: |
          echo "QUANTURA_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "QUANTURA_RESEARCH_DIR=$RUNNER_TEMP/research-output" >> "$GITHUB_ENV"
      - name: Restore an earlier encrypted catalog checkpoint
        if: inputs.smoke_mode == 'real' && inputs.resume_artifact_id != 0
        uses: ./.github/actions/restore-research-artifact
        with:
          artifact_id: ${{ inputs.resume_artifact_id }}
          github_token: ${{ github.token }}
          encryption_key: ${{ secrets.QUANTURA_RESEARCH_ARTIFACT_KEY }}
      - name: No-model safety tests
        if: inputs.smoke_mode == 'mock'
        run: |
          python -m pip install pytest==8.4.2 pyyaml==6.0.3
          python -m pytest -q market_research/tests/test_archive.py market_research/tests/test_engine.py market_research/tests/test_workflows.py
      - name: Verify artifact encryption configuration
        if: inputs.smoke_mode == 'real'
        env:
          QUANTURA_RESEARCH_ARTIFACT_KEY: ${{ secrets.QUANTURA_RESEARCH_ARTIFACT_KEY }}
        run: python -m market_research.artifact check-key
      - name: Collect and checkpoint settled sports events
        if: inputs.smoke_mode == 'real'
        env:
          MAX_PAGES: ${{ inputs.max_pages }}
          SERIES_TICKER: ${{ inputs.series_ticker }}
          START_CURSOR: ${{ inputs.start_cursor }}
          CATALOG_ID: ${{ inputs.catalog_id }}
          MARKET_OFFSET: ${{ inputs.market_offset }}
        run: python -m market_research.archive --source kalshi --series-ticker "$SERIES_TICKER" --max-pages "$MAX_PAGES" --start-cursor "$START_CURSOR" --catalog-id "$CATALOG_ID" --market-offset "$MARKET_OFFSET"
      - name: Preserve compressed encrypted replay archive
        if: always() && inputs.smoke_mode == 'real'
        uses: ./.github/actions/research-artifact
        with:
          encryption_key: ${{ secrets.QUANTURA_RESEARCH_ARTIFACT_KEY }}
          name: kalshi-replay-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Failure disclosure
        if: failure()
        run: echo 'Collection failed. Earlier immutable page reports and private data remain recoverable. No exchange orders were submitted.' >> "$GITHUB_STEP_SUMMARY"
