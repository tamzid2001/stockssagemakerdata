name: FTMO Dukascopy one-year long and short baskets
run-name: FTMO hourly long/short · ${{ inputs.start_date }}–${{ inputs.end_date }}
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First UTC 18:00 origin date, inclusive
        required: true
        type: string
        default: '2025-09-26'
      end_date:
        description: Last origin date; its next-day 17:00 must already be past
        required: true
        type: string
        default: '2026-09-25'
      symbols:
        description: Approved FTMO symbols; all ten by default, one allowed for a smoke run
        required: true
        type: string
        default: 'EURUSD.sim,USDJPY.sim,GBPUSD.sim,GBPJPY.sim,USDCAD.sim,US500.sim,US30.sim,US100.sim,XAUUSD.sim,BTCUSD.sim'
permissions:
  contents: read
concurrency:
  group: ftmo-dukas-${{ inputs.start_date }}-${{ inputs.end_date }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sources: ${{ steps.study.outputs.sources }}
      forecasts: ${{ steps.study.outputs.forecasts }}
      replays: ${{ steps.study.outputs.replays }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Verify causal fills, currency conversion and costs
        run: python -m pytest -q market_research/tests/test_ftmo_dukas_study.py
      - name: Freeze dates, costs, candidates and validation split
        id: study
        env:
          STUDY_START: ${{ inputs.start_date }}
          STUDY_END: ${{ inputs.end_date }}
          STUDY_SYMBOLS: ${{ inputs.symbols }}
        run: |
          python -m market_research.ftmo_dukas_study plan --start "$STUDY_START" --end "$STUDY_END" --symbols "$STUDY_SYMBOLS" --output plan
          python - <<'PY'
          import json,os
          from pathlib import Path
          study=json.loads(Path('plan/study-plan.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              for name in ('sources','forecasts','replays'):
                  stream.write(name+'='+json.dumps({'include':study[name]},separators=(',',':'))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ftmo-dukas-plan
          path: plan/
          retention-days: 7
  source:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.sources) }}
    env:
      SYMBOL: ${{ matrix.symbol }}
      STUDY_START: ${{ inputs.start_date }}
      STUDY_END: ${{ inputs.end_date }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download paired native hourly candles; never decompress annual tick files
        run: python -m market_research.ftmo_dukas_data --symbol "$SYMBOL" --start "$STUDY_START" --end "$STUDY_END" --output "sources/$SYMBOL"
      - uses: actions/upload-artifact@v4
        with:
          name: ftmo-dukas-source-${{ matrix.symbol }}
          path: sources/
          retention-days: 7
  forecast:
    needs: [plan, source]
    runs-on: ${{ fromJSON(vars.ALPACA_OPTIONS_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.forecasts) }}
    env:
      SYMBOL: ${{ matrix.symbol }}
      CHUNK: ${{ matrix.chunk }}
      CHUNK_START: ${{ matrix.start }}
      CHUNK_END: ${{ matrix.end }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      TIMESFM_COMMERCIAL_LICENSED: ${{ vars.TIMESFM_COMMERCIAL_LICENSED || 'false' }}
      TIMESFM_HF_ACCESS_APPROVED: ${{ vars.TIMESFM_HF_ACCESS_APPROVED || 'false' }}
      CUDA_VISIBLE_DEVICES: ''
      GRANITE_DEVICE: cpu
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: market_research/requirements.lock
      - uses: actions/download-artifact@v4
        with:
          name: ftmo-dukas-source-${{ matrix.symbol }}
          path: quotes/
      - name: Install immutable five-model inference environment
        run: python -m pip install --disable-pip-version-check --require-hashes -r market_research/requirements.lock
      - name: Generate real 23-hour forecasts from causal completed H1 closes
        env:
          HF_HOME: ${{ runner.temp }}/ftmo-model-cache
        run: python -m market_research.ftmo_dukas_study forecast --symbol "$SYMBOL" --start "$CHUNK_START" --end "$CHUNK_END" --source "quotes/$SYMBOL" --output "forecasts/${SYMBOL}-c${CHUNK}"
      - name: Preserve completed forecasts and explicit failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ftmo-dukas-forecasts-${{ matrix.symbol }}-${{ matrix.chunk }}
          path: forecasts/
          retention-days: 7
          if-no-files-found: ignore
  replay:
    if: ${{ always() && needs.plan.result == 'success' && needs.source.result == 'success' }}
    needs: [plan, source, forecast]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.replays) }}
    env:
      SYMBOL: ${{ matrix.symbol }}
      SIDE: ${{ matrix.side }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ftmo-dukas-plan
          path: plan/
      - uses: actions/download-artifact@v4
        with:
          pattern: ftmo-dukas-source-*
          merge-multiple: true
          path: sources/
      - uses: actions/download-artifact@v4
        with:
          pattern: ftmo-dukas-forecasts-${{ matrix.symbol }}-*
          merge-multiple: true
          path: forecasts/
      - name: Compare separate basket strategy, prespecified filters and cost stress cases
        run: |
          python -m market_research.ftmo_dukas_study replay --symbol "$SYMBOL" --side "$SIDE" \
            --study plan/study-plan.json --specs plan/ftmo-cost-snapshot.json \
            --sources sources --forecasts forecasts --output "replay/${SYMBOL}-${SIDE}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ftmo-dukas-replay-${{ matrix.symbol }}-${{ matrix.side }}
          path: replay/
          retention-days: 7
          if-no-files-found: ignore
  report:
    if: ${{ always() && needs.plan.result == 'success' }}
    needs: [plan, source, forecast, replay]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ftmo-dukas-plan
          path: plan/
      - uses: actions/download-artifact@v4
        with:
          pattern: ftmo-dukas-replay-*
          merge-multiple: true
          path: research/
      - name: Publish all symbols and sides; incomplete periods remain explicit
        run: python -m market_research.ftmo_dukas_study aggregate --study plan/study-plan.json --specs plan/ftmo-cost-snapshot.json --artifacts research --output report
      - name: Write readable report to the run summary
        if: always()
        run: |
          if [[ -f report/report.md ]]; then cat report/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ftmo-dukas-year-report
          path: report/
          retention-days: 14
          if-no-files-found: ignore
