name: Kalshi BTC Existing Fill Settlement
run-name: Reconcile filled BTC position · ${{ inputs.ticker }}
on:
  workflow_dispatch:
    inputs:
      ticker:
        type: string
        required: true
        description: Exact filled BTC 15-minute market ticker.
      subaccount:
        type: number
        default: 0
        description: Existing subaccount; 0 is the primary account.
      confirmation:
        type: string
        required: true
        description: Enter reconcile-existing-fill. This workflow cannot place orders.
permissions:
  contents: read
concurrency:
  group: quantura-kalshi-btc-execution-singleton
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: quantura-kalshi-live
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r market_research/requirements.lock
      - name: Reconcile only an existing filled position against official settlement
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_PROD_API_KEY }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SETTLEMENT_SUBACCOUNT: ${{ inputs.subaccount || 0 }}
          SETTLEMENT_TICKER: ${{ inputs.ticker }}
          SETTLEMENT_CONFIRMATION: ${{ inputs.confirmation }}
        run: >-
          python -m market_research.kalshi_live_settlement
          --subaccount "$SETTLEMENT_SUBACCOUNT"
          --ticker "$SETTLEMENT_TICKER"
          --confirmation "$SETTLEMENT_CONFIRMATION"
