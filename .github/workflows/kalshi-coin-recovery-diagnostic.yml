name: Kalshi Coin Recovery Read-Only Diagnostic
on:
  workflow_dispatch:
    inputs:
      subaccount:
        type: number
        default: 0
        description: Existing account; 0 is the primary account.
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: quantura-kalshi-live
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r market_research/requirements.lock
      - name: Read six separate journals and authenticated account only
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_PROD_API_KEY }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          AUDIT_SUBACCOUNT: ${{ inputs.subaccount || 0 }}
        run: python -m market_research.kalshi_coin_recovery_diagnostic --subaccount "$AUDIT_SUBACCOUNT"
