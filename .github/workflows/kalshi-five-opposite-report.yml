name: Five selected Kalshi strategies — shared cash replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --no-cache-dir --require-hashes -r market_research/requirements-quotes.lock
      - run: python -m pytest -q market_research/tests/test_opposite_portfolio.py market_research/tests/test_btc_fixed_report.py
      - name: Read and authenticate original encrypted ledgers; no writes
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          QUANTURA_RESEARCH_ARTIFACT_KEY: ${{ secrets.QUANTURA_RESEARCH_ARTIFACT_KEY }}
        run: python -m market_research.opposite_portfolio_report --output "$RUNNER_TEMP/five-portfolio"
      - uses: actions/upload-artifact@v7
        with:
          name: five-opposite-portfolio
          path: ${{ runner.temp }}/five-portfolio/portfolio.json
          if-no-files-found: error
          retention-days: 30
