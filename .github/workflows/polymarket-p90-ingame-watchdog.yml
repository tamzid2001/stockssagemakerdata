name: Polymarket In-Game Backtest Recovery Watchdog
on:
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: polymarket-p90-ingame-watchdog
  cancel-in-progress: false
jobs:
  recover:
    if: vars.POLYMARKET_RECOVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install firebase-admin==7.5.0
      - name: Recover only existing unfinished campaigns
        env:
          GH_TOKEN: ${{ github.token }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python -m market_research.recovery_watchdog
