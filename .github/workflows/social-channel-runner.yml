name: Social Channel Runner

on:
  workflow_call:
    inputs:
      channel:
        description: Social channel key
        required: true
        type: string
      dry_run:
        description: Preview only without publishing
        required: false
        default: false
        type: boolean
      force:
        description: Bypass duplicate-post protection
        required: false
        default: false
        type: boolean
      source_mode:
        description: Content source mode
        required: false
        default: auto
        type: string
      topic:
        description: Optional topic override
        required: false
        default: ""
        type: string
      objective:
        description: Optional objective override
        required: false
        default: ""
        type: string
      audience:
        description: Optional audience override
        required: false
        default: ""
        type: string
      tone:
        description: Optional tone override
        required: false
        default: ""
        type: string
      cta_url:
        description: Optional CTA URL override
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: social-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHANNEL: ${{ inputs.channel }}
      DRY_RUN: ${{ inputs.dry_run }}
      FORCE: ${{ inputs.force }}
      SOURCE_MODE: ${{ inputs.source_mode }}
      TOPIC: ${{ inputs.topic }}
      OBJECTIVE: ${{ inputs.objective }}
      AUDIENCE: ${{ inputs.audience }}
      TONE: ${{ inputs.tone }}
      CTA_URL: ${{ inputs.cta_url }}
      OUTPUT_DIR: artifacts/social/${{ inputs.channel }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'quantura-e2e3d' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || '' }}
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL || '' }}
      GCP_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate GCP auth configuration
        run: |
          python - <<'PY'
          import os

          provider = os.environ.get("GCP_WORKLOAD_IDENTITY_PROVIDER", "").strip()
          service_account = os.environ.get("GCP_SERVICE_ACCOUNT_EMAIL", "").strip()
          key_json = os.environ.get("GCP_SERVICE_ACCOUNT_KEY_JSON", "").strip()
          if provider and service_account:
              print("Workload Identity Federation configuration detected.")
          elif key_json:
              print("Service account JSON fallback detected.")
          else:
              raise SystemExit(
                  "Missing GitHub Actions GCP auth configuration. "
                  "Set repo vars GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT_EMAIL "
                  "or provide the GCP_SERVICE_ACCOUNT_KEY_JSON secret."
              )
          PY

      - name: Authenticate to Google Cloud with OIDC
        if: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT_EMAIL != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Authenticate to Google Cloud with service account JSON fallback
        if: ${{ !(env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT_EMAIL != '') && env.GCP_SERVICE_ACCOUNT_KEY_JSON != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SERVICE_ACCOUNT_KEY_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Install social publishing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-social.txt

      - name: Run social publisher
        run: |
          mkdir -p "${OUTPUT_DIR}"
          cmd=(
            python scripts/social_workflow_runner.py
            --channel "${CHANNEL}"
            --source-mode "${SOURCE_MODE}"
            --output-dir "${OUTPUT_DIR}"
            --project-id "${GCP_PROJECT_ID}"
          )

          if [ "${DRY_RUN}" = "true" ]; then
            cmd+=(--dry-run)
          fi
          if [ "${FORCE}" = "true" ]; then
            cmd+=(--force)
          fi
          if [ -n "${TOPIC}" ]; then
            cmd+=(--topic "${TOPIC}")
          fi
          if [ -n "${OBJECTIVE}" ]; then
            cmd+=(--objective "${OBJECTIVE}")
          fi
          if [ -n "${AUDIENCE}" ]; then
            cmd+=(--audience "${AUDIENCE}")
          fi
          if [ -n "${TONE}" ]; then
            cmd+=(--tone "${TONE}")
          fi
          if [ -n "${CTA_URL}" ]; then
            cmd+=(--cta-url "${CTA_URL}")
          fi

          printf 'Workflow started at %s\n' "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" > "${OUTPUT_DIR}/workflow-run.log"
          printf 'Command: %s\n\n' "${cmd[*]}" >> "${OUTPUT_DIR}/workflow-run.log"
          "${cmd[@]}" 2>&1 | tee -a "${OUTPUT_DIR}/workflow-run.log"

      - name: Upload social artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-${{ inputs.channel }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
