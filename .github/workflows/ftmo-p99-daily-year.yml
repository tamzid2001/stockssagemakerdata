name: FTMO daily P99 seven-session yearly grid study
run-name: ${{ inputs.spy_shares && 'SPY Alpaca above P99 shares' || format('FTMO {0} buy ladders', inputs.entry_rule || 'above_p99') }} · ${{ inputs.start_date }}–${{ inputs.end_date }}
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First completed 18:00 UTC origin date
        required: true
        type: string
        default: '2025-10-07'
      end_date:
        description: Last origin date; next-day 17:00 UTC must already have passed
        required: true
        type: string
        default: '2026-10-06'
      symbols:
        description: Approved assets; all ten by default
        required: true
        type: string
        default: 'EURUSD.sim,USDJPY.sim,GBPUSD.sim,GBPJPY.sim,USDCAD.sim,US500.sim,US30.sim,US100.sim,XAUUSD.sim,BTCUSD.sim'
      resume_run_id:
        description: Optional previous run with all sources complete; reuse frozen sources and completed forecasts
        required: false
        type: string
        default: ''
      entry_rule:
        description: Initial cutoff-close comparison; fixed final P01 stop and final P99-P01 risk stay unchanged
        required: true
        type: choice
        options: [above_p99, above_p90, below_p99, daily_buy]
        default: above_p99
      averaging_gate:
        description: Gate the first addition below P90, or use lower grid levels from the first addition
        required: true
        type: choice
        options: [p90, grid]
        default: p90
      replay_only:
        description: Reuse complete source and forecast artifacts from resume_run_id without downloading provider history or running models
        required: false
        type: boolean
        default: false
      spy_shares:
        description: Run the separate Alpaca SPY share study with the above-P99 gate and seven quantiles
        required: false
        type: boolean
        default: false
      stock_feed:
        description: Historical Alpaca feed for the separate SPY study
        required: false
        type: choice
        options: [sip, iex]
        default: sip
permissions:
  contents: read
  actions: read
concurrency:
  group: ftmo-p99-daily-${{ inputs.entry_rule || 'above_p99' }}-${{ inputs.start_date }}-${{ inputs.end_date }}
  cancel-in-progress: false
jobs:
  spy-shares:
    if: ${{ inputs.spy_shares }}
    uses: ./.github/workflows/spy-p99-share-year.yml
    with:
      start_date: ${{ inputs.start_date }}
      end_date: ${{ inputs.end_date }}
      feed: ${{ inputs.stock_feed || 'sip' }}
    secrets: inherit
  plan:
    if: ${{ !inputs.spy_shares }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sources: ${{ steps.plan.outputs.sources }}
      forecasts: ${{ steps.plan.outputs.forecasts }}
      replays: ${{ steps.plan.outputs.replays }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Verify fixed tail stop, shared risk, causal limits and trailing behavior
        run: python -m pytest -q market_research/tests/test_ftmo_p99.py market_research/tests/test_dukascopy_s3_source.py
      - uses: actions/download-artifact@v4
        if: ${{ inputs.resume_run_id != '' }}
        with:
          name: ftmo-p99-plan
          path: plan/
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Freeze study and current broker specifications
        id: plan
        env:
          STUDY_START: ${{ inputs.start_date }}
          STUDY_END: ${{ inputs.end_date }}
          STUDY_SYMBOLS: ${{ inputs.symbols }}
          REPLAY_ONLY: ${{ inputs.replay_only }}
          SOURCE_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          if [[ "$REPLAY_ONLY" == "true" && ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Replay-only requires a positive frozen source run ID.'
            exit 1
          fi
          python -m market_research.ftmo_p99_study plan --start "$STUDY_START" --end "$STUDY_END" --symbols "$STUDY_SYMBOLS" --output plan
          python - <<'PY'
          import json,os
          from pathlib import Path
          study=json.loads(Path('plan/study-plan.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for key in ('sources','forecasts','replays'):
                  f.write(key+'='+json.dumps({'include':study[key]},separators=(',',':'))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ftmo-p99-plan
          path: plan/
          retention-days: 14
          overwrite: true
  provider-access:
    if: ${{ !inputs.replay_only }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned authenticated source dependencies
        if: ${{ inputs.resume_run_id == '' }}
        run: python -m pip install --disable-pip-version-check --require-hashes -r market_research/requirements-dukas-s3.lock
      - name: Assume archive-only role using temporary GitHub credentials
        if: ${{ inputs.resume_run_id == '' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DUKASCOPY_HISTORY_ROLE_ARN }}
          aws-region: eu-west-1
          allowed-account-ids: '321652031670'
          role-session-name: quantura-dukas-preflight-${{ github.run_id }}
          role-duration-seconds: 7200
      - name: Verify first-party source access before the expensive matrix
        if: ${{ inputs.resume_run_id == '' }}
        env:
          STUDY_END: ${{ inputs.end_date }}
        run: |
          python - <<'PY'
          import json,os
          from datetime import date,timedelta
          from market_research.dukascopy_s3_source import verify_access
          probe=date.fromisoformat(os.environ['STUDY_END'])+timedelta(days=1)
          while probe.weekday()>=5:
              probe-=timedelta(days=1)
          print(json.dumps(verify_access(probe)))
          PY
  source:
    if: ${{ !inputs.replay_only }}
    needs: [plan, provider-access]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.sources) }}
    env:
      SYMBOL: ${{ matrix.symbol }}
      STUDY_START: ${{ inputs.start_date }}
      STUDY_END: ${{ inputs.end_date }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned authenticated source dependencies
        if: ${{ inputs.resume_run_id == '' }}
        run: python -m pip install --disable-pip-version-check --require-hashes -r market_research/requirements-dukas-s3.lock
      - name: Assume archive-only role using temporary GitHub credentials
        if: ${{ inputs.resume_run_id == '' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DUKASCOPY_HISTORY_ROLE_ARN }}
          aws-region: eu-west-1
          allowed-account-ids: '321652031670'
          role-session-name: quantura-dukas-source-${{ github.run_id }}
          role-duration-seconds: 7200
      - uses: actions/download-artifact@v4
        if: ${{ inputs.resume_run_id != '' }}
        with:
          name: ftmo-p99-source-${{ matrix.symbol }}
          path: sources/
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download warmup H1 plus genuine paired M1 for the full replay year
        if: ${{ inputs.resume_run_id == '' }}
        run: python -m market_research.ftmo_p99_study source --symbol "$SYMBOL" --start "$STUDY_START" --end "$STUDY_END" --output "sources/$SYMBOL"
      - uses: actions/upload-artifact@v4
        with:
          name: ftmo-p99-source-${{ matrix.symbol }}
          path: sources/
          retention-days: 14
          overwrite: true
  forecast:
    if: ${{ !inputs.replay_only }}
    needs: [plan, source]
    runs-on: ${{ fromJSON(vars.ALPACA_OPTIONS_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.forecasts) }}
    env:
      SYMBOL: ${{ matrix.symbol }}
      CHUNK: ${{ matrix.chunk }}
      CHUNK_START: ${{ matrix.start }}
      CHUNK_END: ${{ matrix.end }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      TIMESFM_COMMERCIAL_LICENSED: ${{ vars.TIMESFM_COMMERCIAL_LICENSED || 'false' }}
      TIMESFM_HF_ACCESS_APPROVED: ${{ vars.TIMESFM_HF_ACCESS_APPROVED || 'false' }}
      CUDA_VISIBLE_DEVICES: ''
      GRANITE_DEVICE: cpu
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: market_research/requirements.lock
      - uses: actions/download-artifact@v4
        with:
          name: ftmo-p99-source-${{ matrix.symbol }}
          path: sources/
      - name: Restore this shard's completed forecasts
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: ftmo-p99-forecasts-${{ matrix.symbol }}-${{ matrix.chunk }}
          merge-multiple: true
          path: forecasts/
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install immutable CPU five-model inference dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r market_research/requirements.lock
      - name: Forecast seven sessions from exactly 500 completed daily candles
        env:
          HF_HOME: ${{ runner.temp }}/ftmo-p99-model-cache
        run: python -m market_research.ftmo_p99_study forecast --symbol "$SYMBOL" --start "$CHUNK_START" --end "$CHUNK_END" --source "sources/$SYMBOL" --output "forecasts/${SYMBOL}-c${CHUNK}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ftmo-p99-forecasts-${{ matrix.symbol }}-${{ matrix.chunk }}
          path: forecasts/
          retention-days: 14
          overwrite: true
          if-no-files-found: ignore
  replay:
    if: ${{ always() && needs.plan.result == 'success' && (needs.source.result == 'success' || (inputs.replay_only && inputs.resume_run_id != '')) }}
    needs: [plan, source, forecast]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.replays) }}
    env:
      SYMBOL: ${{ matrix.symbol }}
      ENTRY_RULE: ${{ inputs.entry_rule || 'above_p99' }}
      AVERAGING_GATE: ${{ inputs.averaging_gate || 'p90' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ftmo-p99-plan
          path: plan/
      - uses: actions/download-artifact@v4
        with:
          name: ftmo-p99-source-${{ matrix.symbol }}
          path: sources/
          run-id: ${{ inputs.replay_only && inputs.resume_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download causal USDJPY conversion source for GBPJPY
        if: ${{ matrix.symbol == 'GBPJPY.sim' }}
        uses: actions/download-artifact@v4
        with:
          name: ftmo-p99-source-USDJPY.sim
          path: sources/
          run-id: ${{ inputs.replay_only && inputs.resume_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: ftmo-p99-forecasts-${{ matrix.symbol }}-*
          path: forecasts/
          merge-multiple: true
          run-id: ${{ inputs.replay_only && inputs.resume_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare 18 grid/lot candidates, two minute paths and cost stress
        run: python -m market_research.ftmo_p99_study replay --symbol "$SYMBOL" --study plan/study-plan.json --specs plan/ftmo-cost-snapshot.json --sources sources --forecasts forecasts --output "replay/$SYMBOL" --entry-rule "$ENTRY_RULE" --averaging-gate "$AVERAGING_GATE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ftmo-p99-replay-${{ matrix.symbol }}
          path: replay/
          retention-days: 14
          overwrite: true
          if-no-files-found: ignore
  report:
    if: ${{ always() && needs.plan.result == 'success' }}
    needs: [plan, source, forecast, replay]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ftmo-p99-plan
          path: plan/
      - uses: actions/download-artifact@v4
        with:
          pattern: ftmo-p99-replay-*
          path: research/
          merge-multiple: true
      - name: Publish explicit completeness, full-year outcomes and untouched holdout
        env:
          ENTRY_RULE: ${{ inputs.entry_rule || 'above_p99' }}
          AVERAGING_GATE: ${{ inputs.averaging_gate || 'p90' }}
          SOURCE_RUN_ID: ${{ inputs.resume_run_id || github.run_id }}
        run: python -m market_research.ftmo_p99_study aggregate --study plan/study-plan.json --specs plan/ftmo-cost-snapshot.json --artifacts research --output report --entry-rule "$ENTRY_RULE" --averaging-gate "$AVERAGING_GATE" --source-run-id "$SOURCE_RUN_ID"
      - name: Publish readable run summary
        if: always()
        run: |
          if [[ -f report/report.md ]]; then cat report/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ftmo-p99-year-report
          path: report/
          retention-days: 30
          overwrite: true
          if-no-files-found: ignore
