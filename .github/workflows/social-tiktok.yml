name: Social Publish - TikTok

on:
  schedule:
    - cron: "50 17 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without publishing
        required: false
        type: boolean
        default: true
      force:
        description: Bypass duplicate protection
        required: false
        type: boolean
        default: false
      source_mode:
        description: Source mode
        required: false
        type: choice
        options:
          - auto
          - latest_blog
          - manual
        default: auto
      topic:
        description: Optional topic override
        required: false
        type: string
      cta_url:
        description: Optional CTA URL override
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/social-channel-runner.yml
    with:
      channel: tiktok
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
      source_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.source_mode || 'auto' }}
      topic: ${{ github.event_name == 'workflow_dispatch' && inputs.topic || '' }}
      cta_url: ${{ github.event_name == 'workflow_dispatch' && inputs.cta_url || '' }}
    secrets: inherit
