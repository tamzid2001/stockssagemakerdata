<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

        <meta name="description" content="Your Quantura Shop order has been confirmed." />
        <meta name="robots" content="index, follow" />
    <meta name="keywords" content="order confirmation, quantura shop order success" />

    <meta property="og:title" content="Order Confirmed | Quantura Shop" />
    <meta property="og:description" content="Your Quantura Shop order has been confirmed." />

    <meta property="og:url" content="https://quantura.studio/shop/success" />
    <meta property="og:image" content="/assets/quantura-logo.svg" />
    <meta property="og:site_name" content="Quantura" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Order Confirmed | Quantura Shop" />
    <meta name="twitter:description" content="Your Quantura Shop order has been confirmed." />
    <meta name="twitter:image" content="/assets/quantura-logo.svg" />
    <meta name="twitter:url" content="https://quantura.studio/shop/success" />
    <meta name="author" content="Quantura" />
    <meta name="theme-color" content="#0B1526" />
    <link rel="alternate" hreflang="en-US" href="https://quantura.studio/shop/success" />
    <link rel="alternate" hreflang="x-default" href="https://quantura.studio/shop/success" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Quantura" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/shop.css?v=20260404c" />
  </head>
  <body class="shop-page success-page">
    <header class="shop-header">
      <div class="shop-container nav-shell">
        <a class="brand" href="/" aria-label="Quantura home">
          <img src="/assets/quantura-logo.svg" alt="Quantura" />
        </a>
        <nav class="shop-nav" aria-label="Primary">
          <a href="/shop" aria-current="page">Shop</a>
          <a href="/pricing">Pricing</a>
          <a href="/contact">Contact Us</a>
        </nav>
      </div>
    </header>

    <main class="shop-main">
      <section class="shop-container success-shell">
        <p class="eyebrow">Order confirmed</p>
        <h1>Thanks for your purchase.</h1>
        <p class="muted">We are confirming your payment and preparing shipment details.</p>

        <div id="order-status" class="shop-message">Loading order summary...</div>

        <article id="order-summary" class="order-summary hidden" aria-live="polite">
          <div class="summary-row">
            <span>Session</span>
            <strong id="summary-session">-</strong>
          </div>
          <div class="summary-row">
            <span>Status</span>
            <strong id="summary-status">-</strong>
          </div>
          <div class="summary-row">
            <span>Email</span>
            <strong id="summary-email">-</strong>
          </div>
          <div class="summary-row">
            <span>Total</span>
            <strong id="summary-total">-</strong>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <strong id="summary-shipping">-</strong>
          </div>
          <div>
            <h2>Items</h2>
            <ul id="summary-items" class="summary-items"></ul>
          </div>
        </article>

        <div class="success-actions">
          <a class="cta" href="/shop">Back to shop</a>
          <a class="cta secondary" href="/dashboard">Go to dashboard</a>
        </div>
      </section>
    </main>

    <script defer src="/shop-success.js"></script>
  </body>
</html>
