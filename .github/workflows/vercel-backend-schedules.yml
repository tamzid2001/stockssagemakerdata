name: Vercel backend schedules

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Production job to run (scheduled keeps the normal time gates)
        required: true
        default: scheduled
        type: choice
        options:
          - scheduled
          - social-dispatch
          - forecast-report
          - social-planner
          - newsletter-daily
          - newsletter-weekly
          - autopilot-reconcile
          - automation-schedules
          - forecast-boundary-alerts
          - fiscaldata-refresh

concurrency:
  group: vercel-backend-schedules
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CRON_SECRET: ${{ secrets.QUANTURA_CRON_SECRET }}
      API_ORIGIN: https://quantura-api.vercel.app
      LEGACY_ORIGIN: https://quantura-legacy-api.vercel.app
      NEWSLETTER_ORIGIN: https://quantura-newsletter.vercel.app
    steps:
      - name: Validate scheduler secret
        shell: bash
        run: test -n "$CRON_SECRET"

      - name: Run recurring reconciliation jobs
        if: github.event_name != 'workflow_dispatch' || inputs.job == 'scheduled'
        shell: bash
        run: |
          set -euo pipefail
          auth_header="Authorization: Bearer ${CRON_SECRET}"
          job_status=0

          run_api_job() {
            local job="$1"
            echo "Running ${job}"
            if ! curl --fail-with-body --silent --show-error --retry 2 -H "$auth_header" -X POST "${API_ORIGIN}/api/internal/cron/${job}"; then
              echo "Backend job failed: ${job}" >&2
              job_status=1
            fi
          }

          run_api_job "autopilot-reconcile"
          run_api_job "automation-schedules"
          run_api_job "forecast-boundary-alerts"
          exit "$job_status"

      - name: Dispatch time-based production jobs
        if: github.event_name != 'workflow_dispatch' || inputs.job == 'scheduled'
        shell: bash
        run: |
          set -euo pipefail
          auth_header="Authorization: Bearer ${CRON_SECRET}"
          local_hour=$(TZ=America/New_York date +%H)
          local_minute=$(TZ=America/New_York date +%M)
          local_weekday=$(TZ=America/New_York date +%u)
          job_status=0

          run_job() {
            local origin="$1"
            local job="$2"
            if ! curl --fail-with-body --silent --show-error --retry 2 -H "$auth_header" -X POST "${origin}/api/internal/cron/${job}"; then
              job_status=1
            fi
          }

          if (( 10#$local_minute < 15 )); then
            run_job "$LEGACY_ORIGIN" "social-dispatch"
          fi

          if (( 10#$local_minute < 15 || (10#$local_minute >= 30 && 10#$local_minute < 45) )); then
            run_job "$LEGACY_ORIGIN" "forecast-report"
          fi

          if [[ "$local_hour" == "07" ]] && (( 10#$local_minute >= 15 && 10#$local_minute < 30 )); then
            run_job "$LEGACY_ORIGIN" "social-planner"
          fi

          if [[ "$local_hour" == "13" ]] && (( 10#$local_minute < 15 )); then
            run_job "$LEGACY_ORIGIN" "newsletter-daily"
          fi

          if [[ "$local_weekday" == "1" && "$local_hour" == "09" ]] && (( 10#$local_minute < 15 )); then
            run_job "$NEWSLETTER_ORIGIN" "newsletter-weekly"
          fi

          exit "$job_status"

      - name: Run requested production job
        if: github.event_name == 'workflow_dispatch' && inputs.job != 'scheduled'
        shell: bash
        env:
          REQUESTED_JOB: ${{ inputs.job }}
        run: |
          set -euo pipefail
          auth_header="Authorization: Bearer ${CRON_SECRET}"

          case "$REQUESTED_JOB" in
            newsletter-weekly)
              job_origin="$NEWSLETTER_ORIGIN"
              ;;
            autopilot-reconcile|automation-schedules|forecast-boundary-alerts|fiscaldata-refresh)
              job_origin="$API_ORIGIN"
              ;;
            social-dispatch|forecast-report|social-planner|newsletter-daily)
              job_origin="$LEGACY_ORIGIN"
              ;;
            *)
              echo "Unsupported production job: $REQUESTED_JOB" >&2
              exit 2
              ;;
          esac

          curl --fail-with-body --silent --show-error --retry 2 -H "$auth_header" -X POST "${job_origin}/api/internal/cron/${REQUESTED_JOB}"
