name: Hourly Kalshi perpetual screener — five-model ensemble
on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hourly-perpetual-screener
  cancel-in-progress: false
jobs:
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      TIMESFM_HF_ACCESS_APPROVED: ${{ vars.TIMESFM_HF_ACCESS_APPROVED || 'false' }}
      TIMESFM_COMMERCIAL_LICENSED: ${{ vars.TIMESFM_COMMERCIAL_LICENSED || 'false' }}
      SHARD: ${{ matrix.shard }}
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Keep model downloads outside deployment bundles
        run: echo "HF_HOME=$RUNNER_TEMP/quantura-perps-hf" >> "$GITHUB_ENV"
      - name: Install pinned forecast runtime
        run: python -m pip install --no-cache-dir --require-hashes -r market_research/requirements.lock
      - name: Publish real hourly forecasts
        run: python -m ensemble_forecasting.kalshi_perp_screener --shard "$SHARD" --shards 4
