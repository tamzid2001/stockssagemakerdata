name: Kalshi BTC Paper Checkpoint Watchdog
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: kalshi-btc-paper-watchdog
  cancel-in-progress: false
jobs:
  recover:
    if: vars.KALSHI_BTC_PAPER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        history_minutes: ['1', '2']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Resume verified state only if no live worker is active
        env:
          GH_TOKEN: ${{ github.token }}
          KALSHI_BTC_PAPER_ENABLED: ${{ vars.KALSHI_BTC_PAPER_ENABLED }}
          PAPER_HISTORY_MINUTES: ${{ matrix.history_minutes }}
        run: python -m market_research.btc_handoff
