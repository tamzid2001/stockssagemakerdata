name: Quantura Live Smoke Check

on:
  schedule:
    - cron: "30 12 * * *" # Daily 12:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    name: Probe key production routes and API health
    steps:
      - name: Check live endpoints
        env:
          PRIMARY_BASE_URL: https://quantura.studio
          FALLBACK_BASE_URL: https://quantura-e2e3d.web.app
        run: |
          set -euo pipefail

          paths=(
            "/"
            "/forecasting"
            "/screener"
            "/dashboard"
            "/pricing"
            "/developers/api"
            "/contact"
            "/terms"
            "/privacy"
            "/disclaimer"
            "/blog"
          )

          failures=0
          {
            echo "## Quantura Live Smoke Report"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          check_route() {
            local base_url="$1"
            local path="$2"
            local url="${base_url}${path}"
            local tmp
            tmp="$(mktemp)"
            local code
            code="$(curl -L --max-time 30 -sS -o "$tmp" -w "%{http_code}" "$url" || true)"

            if [[ "$code" != "200" ]]; then
              echo "❌ ${url} returned HTTP ${code}"
              echo "- ❌ \`${url}\` -> HTTP ${code}" >> "$GITHUB_STEP_SUMMARY"
              failures=$((failures + 1))
              rm -f "$tmp"
              return
            fi

            if ! grep -qi "QUANTURA" "$tmp"; then
              echo "❌ ${url} did not include expected Quantura marker text"
              echo "- ❌ \`${url}\` -> 200 but marker text missing" >> "$GITHUB_STEP_SUMMARY"
              failures=$((failures + 1))
              rm -f "$tmp"
              return
            fi

            echo "✅ ${url}"
            echo "- ✅ \`${url}\` -> 200" >> "$GITHUB_STEP_SUMMARY"
            rm -f "$tmp"
          }

          for path in "${paths[@]}"; do
            check_route "$PRIMARY_BASE_URL" "$path"
          done

          for api_base in "$PRIMARY_BASE_URL" "$FALLBACK_BASE_URL"; do
            api_url="${api_base}/api/health"
            api_body="$(mktemp)"
            api_code="$(curl -L --max-time 30 -sS -o "$api_body" -w "%{http_code}" "$api_url" || true)"

            if [[ "$api_code" != "200" ]]; then
              echo "❌ ${api_url} returned HTTP ${api_code}"
              echo "- ❌ \`${api_url}\` -> HTTP ${api_code}" >> "$GITHUB_STEP_SUMMARY"
              failures=$((failures + 1))
              rm -f "$api_body"
              continue
            fi

            if ! grep -q '"ok":true' "$api_body"; then
              echo "❌ ${api_url} did not return an ok health payload"
              echo "- ❌ \`${api_url}\` -> 200 but ok payload missing" >> "$GITHUB_STEP_SUMMARY"
              failures=$((failures + 1))
              rm -f "$api_body"
              continue
            fi

            echo "✅ ${api_url}"
            echo "- ✅ \`${api_url}\` -> 200 with ok payload" >> "$GITHUB_STEP_SUMMARY"
            rm -f "$api_body"
          done

          watchdog_url="${PRIMARY_BASE_URL}/api/health/watchdog"
          watchdog_body="$(mktemp)"
          watchdog_code="$(curl -L --max-time 30 -sS -o "$watchdog_body" -w "%{http_code}" "$watchdog_url" || true)"
          if [[ "$watchdog_code" != "200" ]] || ! grep -q '"ok":true' "$watchdog_body"; then
            echo "❌ ${watchdog_url} failed dependency health verification"
            echo "- ❌ \`${watchdog_url}\` -> HTTP ${watchdog_code}" >> "$GITHUB_STEP_SUMMARY"
            failures=$((failures + 1))
          else
            echo "✅ ${watchdog_url}"
            echo "- ✅ \`${watchdog_url}\` -> API and Firestore available" >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$watchdog_body"

          if [[ "$failures" -gt 0 ]]; then
            echo ""
            echo "Smoke check failed with ${failures} failing route(s)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo ""
          echo "All monitored routes are healthy." >> "$GITHUB_STEP_SUMMARY"
