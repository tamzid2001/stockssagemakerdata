name: Prediction Market Paper Worker Recovery Watchdog
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: polymarket-paper-watchdog
  cancel-in-progress: false
jobs:
  recover:
    if: vars.POLYMARKET_PAPER_ENABLED == 'true' || vars.KALSHI_PAPER_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        provider: [polymarket_us, kalshi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Recover only when no active or queued paper worker exists
        env:
          GH_TOKEN: ${{ github.token }}
          POLYMARKET_PAPER_ENABLED: ${{ vars.POLYMARKET_PAPER_ENABLED }}
          KALSHI_PAPER_ENABLED: ${{ vars.KALSHI_PAPER_ENABLED }}
          PAPER_PROVIDER: ${{ matrix.provider }}
          PAPER_HORIZON: ${{ vars.PAPER_ROLLING_HORIZON || '60' }}
          PAPER_LAG_MINUTES: ${{ vars.PAPER_ROLLING_LAG_MINUTES || '30' }}
          PAPER_ROLL_MINUTES: ${{ vars.PAPER_ROLLING_CADENCE || '30' }}
          PAPER_FORECAST_ONLY: 'true'
        run: python -m market_research.handoff
