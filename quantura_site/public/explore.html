<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Explore | Quantura Studio</title>
        <meta name="description" content="Discover forecasts, AI agent runs, and screener results on Quantura Explore." />
    <meta name="robots" content="index, follow" />
    <meta name="keywords" content="explore feed, forecasts, screeners, social research posts" />
    <link rel="canonical" href="https://quantura.studio/explore" />
    <meta property="og:title" content="Explore | Quantura Studio" />
    <meta property="og:description" content="Discover forecasts, AI agent runs, and screener results on Quantura Explore." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://quantura.studio/explore" />
    <meta property="og:image" content="/assets/logo.png" />
    <meta property="og:site_name" content="Quantura" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Explore | Quantura Studio" />
    <meta name="twitter:description" content="Discover forecasts, AI agent runs, and screener results on Quantura Explore." />
    <meta name="twitter:image" content="/assets/logo.png" />
    <meta name="twitter:url" content="https://quantura.studio/explore" />
    <meta name="author" content="Quantura" />
    <meta name="theme-color" content="#0B1526" />
    <link rel="alternate" hreflang="en-US" href="https://quantura.studio/explore" />
    <link rel="alternate" hreflang="x-default" href="https://quantura.studio/explore" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Quantura" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/explore.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/iconoir-icons/iconoir@main/css/iconoir.css" />
    <script defer src="/__/firebase/12.9.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.9.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.9.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/12.9.0/firebase-messaging-compat.js"></script>
    <script defer src="/__/firebase/init.js?useEmulator=false"></script>
    <script defer src="/assets/rnweb/quantura-rnw.js"></script>
    <script type="module" src="/explore.js"></script>
  </head>
  <body>
    <div class="explore-bg"></div>
    <header class="topbar">
      <a class="brand" href="/">
        <img src="/assets/logo.png" alt="Quantura" />
        <span>Quantura Explore</span>
      </a>
      <div class="topbar-actions">
        <a class="link-btn" href="/profile">Profile</a>
        <button id="auth-toggle" class="link-btn" type="button">Sign in</button>
      </div>
    </header>

    <main class="explore-shell">
      <section class="explore-toolbar">
        <form id="explore-search-form" class="search-wrap" autocomplete="off">
          <input id="explore-search" type="search" placeholder="Search tickers, #tags, @handle" aria-label="Search posts" />
          <button type="submit">Search</button>
        </form>
        <div class="tab-row" role="tablist" aria-label="Explore filters">
          <button class="tab is-active" data-mode="trending" role="tab" aria-selected="true">Trending</button>
          <button class="tab" data-mode="latest" role="tab" aria-selected="false">Latest</button>
          <button class="tab" data-mode="following" role="tab" aria-selected="false">Following</button>
          <button class="tab" data-mode="tickers" role="tab" aria-selected="false">Tickers</button>
        </div>
        <div id="ticker-filter-wrap" class="ticker-filter hidden">
          <label for="ticker-filter-input">Ticker</label>
          <input id="ticker-filter-input" type="text" list="ticker-suggestions" placeholder="AAPL" maxlength="12" />
          <datalist id="ticker-suggestions"></datalist>
          <button id="ticker-filter-apply" type="button">Apply</button>
        </div>
      </section>

      <div class="quantura-rn-explore-shell">
        <div
          id="quantura-rn-explore"
          class="quantura-rn-root"
          data-quantura-rn-root
          data-rn-slot-id="explore-native-slot-1"
          data-rn-placement="explore_feed"
          data-rn-context="explore"
          data-rn-title="Explore injected RN panel"
          data-rn-body="The panel is shared RNW UI. Native ad requests resolve only when running inside Quantura iOS/Android shells."
          data-rn-placeholder="true"
        ></div>
      </div>

      <section id="explore-grid" class="explore-grid" aria-live="polite"></section>
      <div id="explore-empty" class="empty-state hidden">No posts found for this filter.</div>
      <div id="explore-loading" class="feed-loading hidden">Loading more insights…</div>
      <div id="explore-sentinel" class="sentinel" aria-hidden="true"></div>
    </main>

    <div id="post-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal="true"></div>
      <article class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="post-modal-title">
        <button id="modal-close" class="modal-close" type="button" aria-label="Close">×</button>
        <div id="post-modal-body"></div>
      </article>
    </div>

    <div id="report-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-report-close="true"></div>
      <article class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="report-modal-title">
        <button id="report-modal-close" class="modal-close" type="button" aria-label="Close">×</button>
        <h2 id="report-modal-title">Report post</h2>
        <form id="report-form" class="comment-form">
          <label for="report-reason">Reason</label>
          <select id="report-reason" required>
            <option value="spam">Spam</option>
            <option value="abuse">Abusive content</option>
            <option value="misinformation">Misinformation</option>
            <option value="copyright">Copyright/IP</option>
            <option value="other">Other</option>
          </select>
          <textarea id="report-details" maxlength="1000" placeholder="Optional details"></textarea>
          <button type="submit">Submit report</button>
        </form>
      </article>
    </div>

    <template id="post-card-template">
      <article class="post-card" tabindex="0">
        <div class="post-preview"></div>
        <div class="post-body">
          <h3 class="post-title"></h3>
          <p class="post-caption"></p>
          <div class="chip-row"></div>
          <div class="post-meta"></div>
          <div class="engagement-row"></div>
        </div>
      </article>
    </template>

    <template id="skeleton-template">
      <article class="post-card skeleton-card" aria-hidden="true">
        <div class="skeleton skeleton-preview"></div>
        <div class="post-body">
          <div class="skeleton skeleton-line w80"></div>
          <div class="skeleton skeleton-line w60"></div>
          <div class="skeleton skeleton-line w40"></div>
        </div>
      </article>
    </template>
  </body>
</html>
