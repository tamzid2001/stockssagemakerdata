name: Sports First-Row Backtest Recovery Watchdog
on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: sports-first-row-watchdog
  cancel-in-progress: false
jobs:
  recover:
    if: vars.SPORTS_FIRST_ROW_REPLAY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install firebase-admin==7.5.0
      - name: Recover only existing unfinished first-row campaigns
        env:
          GH_TOKEN: ${{ github.token }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python -m market_research.recovery_watchdog --first-row
