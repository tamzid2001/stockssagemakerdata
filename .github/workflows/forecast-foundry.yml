name: Forecast Foundry

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers"
        required: true
        default: "MSFT"
      start:
        description: "History start date (YYYY-MM-DD)"
        required: true
        default: "2025-01-01"
      end:
        description: "Optional history end date (YYYY-MM-DD)"
        required: false
        default: ""
      interval:
        description: "Dataset interval"
        required: true
        default: "1d"
      forecast_horizon:
        description: "Forecast horizon"
        required: true
        default: "7"
      max_runtime_seconds:
        description: "Maximum SageMaker Autopilot runtime in seconds"
        required: true
        default: "2400"
      run_key:
        description: "Optional external run key"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  run-foundry:
    runs-on: ubuntu-latest
    env:
      OUTPUT_DIR: artifacts
      WORK_DIR: data/autopilot
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AUTOPILOT_ROLE_ARN: ${{ secrets.AUTOPILOT_ROLE_ARN }}
      AUTOPILOT_S3_BUCKET: ${{ secrets.AUTOPILOT_S3_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate Forecast Foundry secrets
        run: |
          python - <<'PY'
          import os

          required = [
              "AWS_ACCESS_KEY_ID",
              "AWS_SECRET_ACCESS_KEY",
              "AWS_REGION",
              "AUTOPILOT_ROLE_ARN",
              "AUTOPILOT_S3_BUCKET",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing required Forecast Foundry secrets: {', '.join(missing)}")
          print("Forecast Foundry workflow secrets look good.")
          PY

      - name: Install Forecast Foundry dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pandas pytz yfinance

      - name: Prepare artifact directories
        run: |
          mkdir -p "${OUTPUT_DIR}" "${WORK_DIR}"

      - name: Launch Forecast Foundry Autopilot job
        env:
          INPUT_TICKERS: ${{ github.event.inputs.tickers }}
          INPUT_START: ${{ github.event.inputs.start }}
          INPUT_END: ${{ github.event.inputs.end }}
          INPUT_INTERVAL: ${{ github.event.inputs.interval }}
          INPUT_HORIZON: ${{ github.event.inputs.forecast_horizon }}
          INPUT_RUNTIME: ${{ github.event.inputs.max_runtime_seconds }}
          INPUT_RUN_KEY: ${{ github.event.inputs.run_key }}
        run: |
          set -euo pipefail
          RUN_KEY="${INPUT_RUN_KEY:-}"
          if [ -z "${RUN_KEY}" ]; then
            RUN_KEY="quantura_foundry_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          fi
          SAFE_PREFIX="$(printf '%s' "${RUN_KEY}" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9._-' '-')"
          MANIFEST_PATH="${OUTPUT_DIR}/forecast_foundry_manifest.json"
          LOG_PATH="${OUTPUT_DIR}/workflow-run.log"

          {
            echo "Workflow started at $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "Run key: ${RUN_KEY}"
            echo "Tickers: ${INPUT_TICKERS}"
            echo "Start: ${INPUT_START}"
            echo "End: ${INPUT_END:-auto}"
            echo "Interval: ${INPUT_INTERVAL}"
            echo "Forecast horizon: ${INPUT_HORIZON}"
            echo "Max runtime seconds: ${INPUT_RUNTIME}"
          } > "${LOG_PATH}"

          CMD=(
            python scripts/run_autopilot_timeseries.py
            --tickers "${INPUT_TICKERS}"
            --start "${INPUT_START}"
            --interval "${INPUT_INTERVAL}"
            --s3-bucket "${AUTOPILOT_S3_BUCKET}"
            --s3-prefix "forecast-foundry/${SAFE_PREFIX}"
            --role-arn "${AUTOPILOT_ROLE_ARN}"
            --region "${AWS_REGION}"
            --forecast-horizon "${INPUT_HORIZON}"
            --max-runtime-seconds "${INPUT_RUNTIME}"
            --job-name-prefix "quantura-foundry"
            --run-key "${RUN_KEY}"
            --emit-json "${MANIFEST_PATH}"
            --workdir "${WORK_DIR}"
          )

          if [ -n "${INPUT_END}" ]; then
            CMD+=(--end "${INPUT_END}")
          fi

          printf 'Command: %s\n\n' "${CMD[*]}" >> "${LOG_PATH}"
          "${CMD[@]}" 2>&1 | tee -a "${LOG_PATH}"

      - name: Upload Forecast Foundry artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-foundry-run
          path: |
            ${{ env.OUTPUT_DIR }}
            ${{ env.WORK_DIR }}
          if-no-files-found: warn

      - name: Write workflow summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          manifest_path = Path(os.environ["OUTPUT_DIR"]) / "forecast_foundry_manifest.json"
          with open(summary_path, "a", encoding="utf-8") as summary:
              summary.write("## Forecast Foundry Run\n\n")
              if not manifest_path.exists():
                  summary.write("Manifest was not generated.\n")
                  raise SystemExit(0)
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              summary.write(f"- Status: `{manifest.get('status', 'unknown')}`\n")
              summary.write(f"- Run key: `{manifest.get('runKey', '')}`\n")
              summary.write(f"- Job name: `{manifest.get('jobName', '')}`\n")
              summary.write(f"- Tickers: `{', '.join(manifest.get('tickers', []))}`\n")
              summary.write(f"- Window: `{manifest.get('start', '')}` to `{manifest.get('end', '')}`\n")
              summary.write(f"- Interval: `{manifest.get('interval', '')}`\n")
              summary.write(f"- Forecast horizon: `{manifest.get('forecastHorizon', '')}`\n")
              summary.write(f"- Training rows: `{manifest.get('trainingRowCount', '')}`\n")
              summary.write(f"- Input S3 URI: `{manifest.get('inputS3Uri', '')}`\n")
              summary.write(f"- Output S3 URI: `{manifest.get('outputS3Uri', '')}`\n")
          PY
