name: Alpaca SPY 0DTE Hourly Options Worker
run-name: Alpaca SPY 0DTE · ${{ inputs.mode || 'paper' }} · one contract · $200 cap
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify sends no orders; paper uses Alpaca paper; live requires separately pinned approval and live credentials'
        required: true
        type: choice
        options: [verify, paper, live]
        default: verify
permissions:
  contents: read
concurrency:
  group: alpaca-spy-0dte-worker
  cancel-in-progress: false
jobs:
  worker:
    runs-on: ${{ fromJSON(vars.ALPACA_OPTIONS_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 355
    env:
      MODE: ${{ inputs.mode || 'paper' }}
      QUANTURA_CODE_SHA: ${{ inputs.mode == 'live' && vars.QUANTURA_ALPACA_APPROVED_SHA || github.sha }}
      QUANTURA_ALPACA_LIVE_ENABLED: ${{ vars.QUANTURA_ALPACA_LIVE_ENABLED || 'false' }}
      QUANTURA_ALPACA_APPROVED_SHA: ${{ vars.QUANTURA_ALPACA_APPROVED_SHA || '' }}
      TIMESFM_COMMERCIAL_LICENSED: ${{ vars.TIMESFM_COMMERCIAL_LICENSED || 'false' }}
      TIMESFM_HF_ACCESS_APPROVED: ${{ vars.TIMESFM_HF_ACCESS_APPROVED || 'false' }}
      CUDA_VISIBLE_DEVICES: ''
      GRANITE_DEVICE: cpu
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - name: Validate release gate before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MODE" =~ ^(verify|paper|live)$ ]]
          [[ "$QUANTURA_CODE_SHA" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$MODE" == live ]]; then
            [[ "$QUANTURA_ALPACA_LIVE_ENABLED" == true ]]
            [[ "$QUANTURA_ALPACA_APPROVED_SHA" == "$QUANTURA_CODE_SHA" ]]
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.QUANTURA_CODE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned CPU inference environment
        if: env.MODE != 'verify'
        run: python -m pip install --disable-pip-version-check --require-hashes -r market_research/requirements.lock
      - name: Test strategy and verify immutable risk rules
        if: env.MODE != 'verify'
        run: python -m pytest -q market_research/tests/test_alpaca_spy_strategy.py market_research/tests/test_alpaca_spy_worker.py
      - name: Show proposed configuration without authentication or orders
        run: python -m market_research.alpaca_spy_worker --mode verify
      - name: Run one bounded worker segment
        if: env.MODE != 'verify'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_LIVE_API_KEY: ${{ secrets.ALPACA_LIVE_API_KEY }}
          ALPACA_LIVE_SECRET_KEY: ${{ secrets.ALPACA_LIVE_SECRET_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HOME: ${{ runner.temp }}/quantura-alpaca-spy-model-cache
        run: python -m market_research.alpaca_spy_worker --mode "$MODE" --duration-minutes 165
