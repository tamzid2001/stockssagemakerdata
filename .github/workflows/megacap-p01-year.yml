name: Mega-cap P01 one-year six-hour backtest
run-name: Mega-cap P01 down-only · ${{ inputs.start_date }}–${{ inputs.end_date }}
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First exchange date, inclusive
        type: string
        required: true
        default: '2025-09-26'
      end_date:
        description: Last completed exchange date, inclusive
        type: string
        required: true
        default: '2026-09-25'
      feed:
        description: Actual Alpaca minute-bar feed
        type: choice
        options: [sip, iex]
        default: sip
permissions:
  contents: read
concurrency:
  group: megacap-p01-${{ inputs.start_date }}-${{ inputs.end_date }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas-market-calendars pytest
      - name: Verify causal replay and build the bounded study
        id: plan
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          python -m pytest -q market_research/tests/test_megacap_p01_backtest.py
          python - <<'PY'
          import json, os
          from datetime import date
          from pathlib import Path
          from market_research.megacap_p01_backtest import plan
          study=plan(date.fromisoformat(os.environ['START_DATE']),date.fromisoformat(os.environ['END_DATE']))
          Path('study-plan.json').write_text(json.dumps(study,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps({'include':study['include']},separators=(',',':'))+'\n')
          print(f"Planned {study['planned_forecasts']} forecasts across {len(study['include'])} stock/date chunks.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: megacap-p01-plan
          path: study-plan.json
          retention-days: 7
  replay:
    needs: plan
    runs-on: ${{ fromJSON(vars.ALPACA_OPTIONS_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SYMBOL: ${{ matrix.symbol }}
      CHUNK: ${{ matrix.chunk }}
      START_DATE: ${{ matrix.start }}
      END_DATE: ${{ matrix.end }}
      FEED: ${{ inputs.feed }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      TIMESFM_COMMERCIAL_LICENSED: ${{ vars.TIMESFM_COMMERCIAL_LICENSED || 'false' }}
      TIMESFM_HF_ACCESS_APPROVED: ${{ vars.TIMESFM_HF_ACCESS_APPROVED || 'false' }}
      CUDA_VISIBLE_DEVICES: ''
      GRANITE_DEVICE: cpu
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install immutable inference environment
        run: python -m pip install --disable-pip-version-check --require-hashes -r market_research/requirements.lock
      - name: Replay fixed P01 strategy with five real models
        env:
          HF_HOME: ${{ runner.temp }}/megacap-model-cache
        run: |
          python -m market_research.megacap_p01_backtest run \
            --symbol "$SYMBOL" --start "$START_DATE" --end "$END_DATE" \
            --feed "$FEED" --output "artifacts/${SYMBOL}-q${CHUNK}"
      - name: Keep completed days and explicit failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: megacap-p01-data-${{ matrix.symbol }}-${{ matrix.chunk }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore
  report:
    if: ${{ always() && needs.plan.result == 'success' }}
    needs: [plan, replay]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: megacap-p01-plan
          path: plan/
      - uses: actions/download-artifact@v4
        with:
          pattern: megacap-p01-data-*
          merge-multiple: true
          path: research/
      - name: Aggregate all ten stocks; never hide missing days
        run: python -m market_research.megacap_p01_backtest aggregate --artifacts research --plan plan/study-plan.json --output report
      - name: Publish readable complete or partial report
        if: always()
        run: |
          if [[ -f report/report.md ]]; then cat report/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: megacap-p01-year-report
          path: report/
          retention-days: 14
          if-no-files-found: ignore
