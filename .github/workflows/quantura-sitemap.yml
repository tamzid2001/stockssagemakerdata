name: Quantura Sitemap Refresh

on:
  schedule:
    - cron: "15 6 * * *" # Daily 06:15 UTC
  workflow_dispatch:

permissions: {}

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Regenerate sitemap.xml
        run: node quantura_site/scripts/generate-sitemap.mjs

      - name: Commit sitemap updates
        run: |
          if git diff --quiet -- quantura_site/public/sitemap.xml; then
            echo "No sitemap changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quantura_site/public/sitemap.xml
          git commit -m "chore(seo): refresh sitemap.xml"
          git push
