name: Alpaca SPY Intraday Options Backtest
on:
  workflow_dispatch:
    inputs:
      days_json:
        description: 'JSON array of NYSE dates, e.g. ["2026-09-25"]'
        required: true
        type: string
      horizons_json:
        description: 'JSON array from 15, 30, 45, 60, e.g. [60]'
        required: true
        type: string
      feed:
        description: 'Actual Alpaca stock bars; SIP may require a subscription for the latest 15 minutes'
        required: true
        type: choice
        options: [iex, sip]
        default: iex
      pricing:
        description: 'Underlying SPY dollar change per share, or option trade-bar proxy (requires option history entitlement)'
        required: true
        type: choice
        options: [underlying, option_bars]
        default: underlying
      data_only:
        description: 'Check historical bar and contract coverage without model inference'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  replay:
    runs-on: ${{ fromJSON(vars.ALPACA_OPTIONS_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        day: ${{ fromJSON(inputs.days_json) }}
        horizon: ${{ fromJSON(inputs.horizons_json) }}
    env:
      DAY: ${{ matrix.day }}
      HORIZON: ${{ matrix.horizon }}
      FEED: ${{ inputs.feed }}
      PRICING: ${{ inputs.pricing }}
      DATA_ONLY: ${{ inputs.data_only }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      TIMESFM_COMMERCIAL_LICENSED: ${{ vars.TIMESFM_COMMERCIAL_LICENSED || 'false' }}
      TIMESFM_HF_ACCESS_APPROVED: ${{ vars.TIMESFM_HF_ACCESS_APPROVED || 'false' }}
      CUDA_VISIBLE_DEVICES: ''
      GRANITE_DEVICE: cpu
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install immutable inference environment
        run: python -m pip install --disable-pip-version-check --require-hashes -r market_research/requirements.lock
      - name: Test read-only replay rules
        run: python -m pytest -q market_research/tests/test_alpaca_spy_intraday_backtest.py
      - name: Replay one day and horizon
        shell: bash
        env:
          HF_HOME: ${{ runner.temp }}/spy-intraday-model-cache
        run: |
          set -euo pipefail
          args=(--day "$DAY" --horizon "$HORIZON" --feed "$FEED" --pricing "$PRICING" --output "artifacts/$DAY-$HORIZON")
          if [[ "$DATA_ONLY" == true ]]; then args+=(--data-only); fi
          python -m market_research.alpaca_spy_intraday_backtest "${args[@]}"
      - name: Upload complete or partial immutable research output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spy-intraday-${{ matrix.day }}-${{ matrix.horizon }}-${{ github.run_id }}
          path: artifacts/${{ matrix.day }}-${{ matrix.horizon }}/
          retention-days: 14
          if-no-files-found: ignore
